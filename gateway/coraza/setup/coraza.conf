# Lanticell Coraza Base Configuration
# Pinned CRS: 4.10.0

SecRuleEngine DetectionOnly

# Request body inspection & resource-exhaustion limits
SecRequestBodyAccess On
SecRequestBodyLimit 131072
SecRequestBodyNoFilesLimit 65536
SecRequestBodyLimitAction Reject

SecResponseBodyAccess Off

# Parser & regex limits
SecPcreMatchLimit 10000
SecPcreMatchLimitRecursion 10000

# Bounded JSON audit log (no raw sensitive bodies)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogFormat JSON
SecAuditLogParts ABHZ
