global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lanticell-control-api
    metrics_path: /metrics
    static_configs:
      - targets: ['control-api:8080']

  - job_name: lanticell-botd
    metrics_path: /metrics
    static_configs:
      - targets: ['botd:8090']
