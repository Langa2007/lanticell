name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-services:
    name: Go Vet, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet event-schema and detector-sdk
        run: |
          (cd packages/event-schema && go vet ./...)
          (cd packages/detector-sdk && go vet ./...)

      - name: Vet, test, and build bot-engine
        working-directory: apps/bot-engine
        run: |
          go vet ./...
          go test -race -v ./...
          go build -o ../../bin/botd ./cmd/botd

      - name: Vet, test, and build control-api
        working-directory: apps/control-api
        run: |
          go vet ./...
          go test -race -v ./...
          go build -o ../../bin/control-api ./cmd/api

      - name: Vet, test, and build gateway-agent (includes WAF replay corpus)
        working-directory: apps/gateway-agent
        run: |
          go vet ./...
          go test -race -v ./...
          go build -o ../../bin/gateway-agent ./cmd/agent

  dashboard:
    name: Dashboard Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  nginx-config:
    name: Validate NGINX Base Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test nginx.conf syntax
        run: |
          mkdir -p /tmp/nginx-confd
          docker run --rm \
            -v "${{ github.workspace }}/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "/tmp/nginx-confd:/etc/nginx/conf.d:ro" \
            nginx:1.27-alpine nginx -t
