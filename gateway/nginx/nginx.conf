worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Slow-client / Slowloris protection
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          15s;
    keepalive_timeout     30s;

    # Coarse L7 rate & connection limits
    limit_conn_zone $binary_remote_addr zone=lanticell_conn:10m;
    limit_req_zone  $binary_remote_addr zone=lanticell_req:20m rate=50r/s;

    log_format lanticell_json escape=json '{'
        '"time":"$time_iso8601",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"req_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.log lanticell_json;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404 "unconfigured host\n";
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
