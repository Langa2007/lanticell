name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go modules
        run: |
          (cd packages/event-schema && govulncheck ./...)
          (cd packages/detector-sdk && govulncheck ./...)
          (cd apps/control-api && govulncheck ./...)
          (cd apps/gateway-agent && govulncheck ./...)
          (cd apps/bot-engine && govulncheck ./...)

  trivy:
    name: Trivy Filesystem & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            ghcr.io/aquasecurity/trivy:latest fs \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            /workspace
